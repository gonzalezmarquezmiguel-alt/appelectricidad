<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ElectriGest — Obras y Presupuestos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF1F3">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316324F'/%3E%3Cpath d='M55 15 L30 55 L48 55 L42 85 L72 42 L52 42 Z' fill='%23C6742A'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#EEF1F3;
  --paper-2:#FFFFFF;
  --grid-line:#D7E0E6;
  --ink:#16324F;
  --ink-soft:#5A7185;
  --ink-faint:#93A5B4;
  --copper:#B5651D;
  --copper-dark:#8F4E15;
  --copper-soft:#F0DCC7;
  --ground:#3F6644;
  --ground-soft:#DCE9DE;
  --live:#B23A2E;
  --live-soft:#F4DAD7;
  --amber:#B98A1E;
  --amber-soft:#F1E4C4;
  --purple:#6B4FA0;
  --purple-soft:#E5DEF1;
  --blue:#2F6F94;
  --blue-soft:#DAE8EE;
  --grey:#6B7280;
  --grey-soft:#E4E6E8;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(22,50,79,.06), 0 4px 16px rgba(22,50,79,.07);
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:var(--font-ui);
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:transparent; padding-bottom:env(safe-area-inset-bottom);}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  background:rgba(238,241,243,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--grid-line);
}
.topbar h1{
  font-size:19px; margin:0; letter-spacing:.2px; font-weight:800; color:var(--ink);
  flex:1; display:flex; align-items:center; gap:8px; min-width:0;
}
.topbar h1 small{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); letter-spacing:.6px; text-transform:uppercase;}
.icon-btn{
  width:38px; height:38px; border-radius:11px; border:1px solid var(--grid-line);
  background:var(--paper-2); color:var(--ink); display:flex; align-items:center; justify-content:center;
  flex-shrink:0; cursor:pointer;
}
.icon-btn:active{background:var(--grey-soft);}
.back-btn{display:flex; align-items:center; gap:6px; color:var(--copper-dark); font-weight:700; font-size:14px; background:none; border:none; padding:0; cursor:pointer;}
.brand-mark{width:26px; height:26px; flex-shrink:0;}

/* ---------- Main / lists ---------- */
main{flex:1; padding:16px 16px 100px;}
.eyebrow{font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--copper-dark); margin:0 0 6px;}
.section-title{font-size:15px; font-weight:800; color:var(--ink); margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.card{
  background:var(--paper-2); border:1px solid var(--grid-line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px; margin-bottom:10px; cursor:pointer;
}
.card:active{background:#FAFBFC;}
.card-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.card-title{font-weight:800; font-size:15.5px; color:var(--ink); margin:0 0 3px;}
.card-sub{font-size:12.5px; color:var(--ink-soft); margin:0;}
.card-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:99px; letter-spacing:.2px; white-space:nowrap;}
.badge-vivienda{background:var(--blue-soft); color:var(--blue);}
.badge-local{background:var(--purple-soft); color:var(--purple);}
.badge-presupuestada{background:var(--amber-soft); color:var(--amber);}
.badge-curso{background:var(--copper-soft); color:var(--copper-dark);}
.badge-terminada{background:var(--ground-soft); color:var(--ground);}
.badge-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

.stat-row{display:flex; gap:8px; margin-top:8px;}
.stat-pill{flex:1; background:var(--paper); border:1px solid var(--grid-line); border-radius:10px; padding:7px 9px; text-align:center;}
.stat-pill b{display:block; font-family:var(--font-mono); font-size:14px; color:var(--ink); font-weight:700;}
.stat-pill span{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; font-weight:700;}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state svg{opacity:.5; margin-bottom:12px;}
.empty-state h3{color:var(--ink); font-size:16px; margin:0 0 6px;}
.empty-state p{font-size:13.5px; margin:0; line-height:1.5;}

/* ---------- FAB ---------- */
.fab{
  position:fixed; right:calc(50% - 280px + 20px); bottom:calc(24px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; background:var(--copper); color:#fff; border:none;
  box-shadow:0 6px 20px rgba(181,101,29,.4); display:flex; align-items:center; justify-content:center;
  z-index:30; cursor:pointer;
}
@media (max-width:600px){ .fab{right:20px;} }
.fab:active{background:var(--copper-dark);}

/* ---------- Tabs ---------- */
.tabbar{display:flex; gap:4px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{
  flex-shrink:0; padding:8px 13px; border-radius:99px; border:1px solid var(--grid-line);
  background:var(--paper-2); color:var(--ink-soft); font-weight:700; font-size:12.5px; cursor:pointer;
}
.tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-family:inherit; font-weight:700; font-size:14px; padding:11px 16px; border-radius:11px;
  border:1px solid transparent; cursor:pointer; width:100%;
}
.btn-primary{background:var(--copper); color:#fff;}
.btn-primary:active{background:var(--copper-dark);}
.btn-ghost{background:var(--paper-2); color:var(--ink); border-color:var(--grid-line);}
.btn-ghost:active{background:var(--grey-soft);}
.btn-danger{background:var(--live-soft); color:var(--live);}
.btn-danger:active{background:#ecc4c0;}
.btn-sm{width:auto; padding:7px 12px; font-size:12.5px;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{width:auto; flex:1;}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
  width:100%; padding:11px 12px; border:1px solid var(--grid-line); border-radius:10px;
  font-family:inherit; font-size:15px; background:var(--paper-2); color:var(--ink);
}
input:focus, select:focus, textarea:focus{outline:2px solid var(--copper); outline-offset:1px;}
textarea{resize:vertical; min-height:70px;}
.field-hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.seg{display:flex; gap:6px; flex-wrap:wrap;}
.seg-opt{flex:1; min-width:90px; text-align:center; padding:9px 8px; border-radius:9px; border:1px solid var(--grid-line); background:var(--paper-2); font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
.seg-opt.active{background:var(--ink); color:#fff; border-color:var(--ink);}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(22,50,79,.4); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-backdrop.center{align-items:center; padding:20px;}
.modal-sheet{
  width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  background:var(--paper); border-radius:20px 20px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.modal-backdrop.center .modal-sheet{border-radius:18px; max-height:80vh;}
.modal-handle{width:36px; height:4px; background:var(--grid-line); border-radius:99px; margin:0 auto 14px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h2{font-size:17px; margin:0; font-weight:800;}
.modal-close{background:none; border:none; color:var(--ink-soft); font-size:22px; line-height:1; cursor:pointer; padding:4px;}

/* ---------- Resumen / stats ---------- */
.big-stat{background:var(--paper-2); border:1px solid var(--grid-line); border-radius:var(--radius); padding:16px; margin-bottom:10px;}
.big-stat-row{display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px dashed var(--grid-line);}
.big-stat-row:last-child{border-bottom:none;}
.big-stat-row span{font-size:13.5px; color:var(--ink-soft); font-weight:600;}
.big-stat-row b{font-family:var(--font-mono); font-size:15px; color:var(--ink);}
.big-stat-row.total{border-top:2px solid var(--ink); margin-top:6px; padding-top:12px;}
.big-stat-row.total span{color:var(--ink); font-weight:800; font-size:14.5px;}
.big-stat-row.total b{font-size:19px; color:var(--copper-dark);}

/* ---------- List rows (horas / materiales) ---------- */
.row-item{display:flex; align-items:center; gap:10px; background:var(--paper-2); border:1px solid var(--grid-line); border-radius:12px; padding:11px 12px; margin-bottom:8px;}
.row-item .cat-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.row-main{flex:1; min-width:0;}
.row-main b{font-size:14px; display:block;}
.row-main span{font-size:12px; color:var(--ink-soft);}
.row-val{font-family:var(--font-mono); font-weight:700; font-size:14px; text-align:right; white-space:nowrap;}
.row-actions{display:flex; gap:4px;}
.icon-mini{width:30px; height:30px; border-radius:8px; border:1px solid var(--grid-line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); flex-shrink:0;}
.icon-mini.danger{color:var(--live);}

/* ---------- Planos ---------- */
.plano-thumb{display:flex; gap:12px; align-items:center; background:var(--paper-2); border:1px solid var(--grid-line); border-radius:var(--radius); padding:10px; margin-bottom:10px; cursor:pointer;}
.plano-thumb img{width:74px; height:74px; object-fit:cover; border-radius:9px; border:1px solid var(--grid-line); flex-shrink:0;}
.plano-thumb .pth-info{flex:1; min-width:0;}
.plano-thumb .pth-info b{font-size:14.5px; display:block; margin-bottom:2px;}
.plano-thumb .pth-info span{font-size:12px; color:var(--ink-soft);}

.plano-canvas-wrap{
  position:relative; width:100%; border-radius:var(--radius); overflow:hidden; border:1px solid var(--grid-line);
  background:repeating-linear-gradient(0deg, #fff, #fff 27px, var(--grid-line) 28px), repeating-linear-gradient(90deg, #fff, #fff 27px, var(--grid-line) 28px);
  touch-action:none;
}
.plano-canvas-wrap img{display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none; pointer-events:none;}
.pin{
  position:absolute; width:26px; height:26px; margin-left:-13px; margin-top:-26px;
  display:flex; align-items:center; justify-content:center; border-radius:50% 50% 50% 0;
  transform:rotate(45deg); border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35); cursor:pointer;
}
.pin span{transform:rotate(-45deg); font-size:10px; font-weight:800; color:#fff;}
.pin-add-hint{
  position:absolute; top:10px; left:10px; right:10px; background:rgba(22,50,79,.88); color:#fff;
  font-size:12px; font-weight:700; padding:8px 10px; border-radius:9px; text-align:center; pointer-events:none;
}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.legend-item{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); font-weight:700; background:var(--paper-2); border:1px solid var(--grid-line); padding:4px 8px; border-radius:99px;}
.legend-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}

.toggle-add{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:11px; border-radius:11px; border:1px dashed var(--copper); background:var(--copper-soft);
  color:var(--copper-dark); font-weight:800; font-size:13.5px; cursor:pointer; margin-bottom:10px;
}
.toggle-add.on{background:var(--copper); color:#fff; border-style:solid;}

.photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.photo-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:9px; border:1px solid var(--grid-line); cursor:pointer;}
.photo-add-tile{
  width:100%; aspect-ratio:1; border-radius:9px; border:1px dashed var(--ink-faint); background:var(--paper);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer;
}

.lightbox{position:fixed; inset:0; background:#0F1B26; z-index:200; display:flex; flex-direction:column;}
.lightbox-top{display:flex; justify-content:space-between; align-items:center; padding:calc(14px + env(safe-area-inset-top)) 16px 10px;}
.lightbox-top button{background:rgba(255,255,255,.12); border:none; color:#fff; width:36px; height:36px; border-radius:10px; font-size:20px;}
.lightbox-img-wrap{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0 10px;}
.lightbox-img-wrap img{max-width:100%; max-height:100%; object-fit:contain; border-radius:6px;}
.lightbox-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.14); border:none; color:#fff; width:38px; height:38px; border-radius:50%; font-size:18px;}
.lightbox-panel{background:var(--paper); border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));}

/* ---------- misc ---------- */
.footer-note{text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:22px; padding-bottom:10px;}
.divider{height:1px; background:var(--grid-line); margin:16px 0;}
select[multiple]{height:auto;}
.category-picker{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.cat-opt{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--grid-line); background:var(--paper-2); cursor:pointer; font-size:13px; font-weight:700; color:var(--ink);}
.cat-opt.active{border-color:var(--ink);}
.cat-opt .dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}

@media print{
  body{background:#fff !important;}
  .topbar,.fab,.tabbar,.toggle-add,.icon-mini,.btn{display:none !important;}
  #print-area{display:block !important;}
}
#print-area{display:none;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* =========================================================
   CONSTANTES Y CATÁLOGO INICIAL
========================================================= */
const DB_NAME = "electrigest_db_v1";
const DB_VERSION = 1;
const STORES = ["obras","horas","materialesCatalogo","materialesObra","planos","pines","fotos","config"];

const CATEGORIAS = {
  enchufe:        {label:"Enchufe",        color:"#2F6F94"},
  magnetotermico: {label:"Magnetotérmico", color:"#B23A2E"},
  diferencial:    {label:"Diferencial",    color:"#3F6644"},
  interruptor:    {label:"Interruptor",    color:"#B98A1E"},
  conmutador:     {label:"Conmutador",     color:"#6B4FA0"},
  punto_luz:      {label:"Punto de luz",   color:"#D4A017"},
  cuadro:         {label:"Cuadro eléctrico",color:"#16324F"},
  cable:          {label:"Cable",          color:"#5A7185"},
  otro:           {label:"Otro",           color:"#6B7280"}
};

const SEED_CATALOGO = [
  {nombre:"Enchufe schuko", categoria:"enchufe", precio:3.5, unidad:"ud"},
  {nombre:"Enchufe estanco IP44", categoria:"enchufe", precio:6.0, unidad:"ud"},
  {nombre:"Base de TV", categoria:"enchufe", precio:4.0, unidad:"ud"},
  {nombre:"Base RJ45 (datos)", categoria:"enchufe", precio:5.5, unidad:"ud"},
  {nombre:"Magnetotérmico 10A", categoria:"magnetotermico", precio:8.0, unidad:"ud"},
  {nombre:"Magnetotérmico 16A", categoria:"magnetotermico", precio:8.0, unidad:"ud"},
  {nombre:"Magnetotérmico 20A", categoria:"magnetotermico", precio:8.5, unidad:"ud"},
  {nombre:"Magnetotérmico 25A", categoria:"magnetotermico", precio:9.0, unidad:"ud"},
  {nombre:"Magnetotérmico 32A", categoria:"magnetotermico", precio:10.0, unidad:"ud"},
  {nombre:"Diferencial 25A 30mA", categoria:"diferencial", precio:35.0, unidad:"ud"},
  {nombre:"Diferencial 40A 30mA", categoria:"diferencial", precio:45.0, unidad:"ud"},
  {nombre:"Interruptor simple", categoria:"interruptor", precio:3.0, unidad:"ud"},
  {nombre:"Interruptor doble", categoria:"interruptor", precio:4.5, unidad:"ud"},
  {nombre:"Conmutador", categoria:"conmutador", precio:3.8, unidad:"ud"},
  {nombre:"Cruzamiento", categoria:"conmutador", precio:5.0, unidad:"ud"},
  {nombre:"Punto de luz / downlight", categoria:"punto_luz", precio:12.0, unidad:"ud"},
  {nombre:"Cuadro eléctrico (caja + módulos)", categoria:"cuadro", precio:60.0, unidad:"ud"},
  {nombre:"Cable 1.5mm²", categoria:"cable", precio:0.6, unidad:"m"},
  {nombre:"Cable 2.5mm²", categoria:"cable", precio:0.9, unidad:"m"},
  {nombre:"Cable 4mm²", categoria:"cable", precio:1.4, unidad:"m"},
  {nombre:"Cable 6mm²", categoria:"cable", precio:2.1, unidad:"m"},
  {nombre:"Detector de humo", categoria:"otro", precio:15.0, unidad:"ud"},
  {nombre:"Timbre / videoportero", categoria:"otro", precio:40.0, unidad:"ud"}
];

/* =========================================================
   INDEXEDDB HELPERS
========================================================= */
let dbInstance = null;
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      STORES.forEach(name=>{
        if(!db.objectStoreNames.contains(name)){
          if(name === "config"){
            db.createObjectStore(name, {keyPath:"key"});
          } else {
            db.createObjectStore(name, {keyPath:"id", autoIncrement:true});
          }
        }
      });
    };
    req.onsuccess = (e)=>{ dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = (e)=> reject(e);
  });
}
function tx(store, mode){ return dbInstance.transaction(store, mode).objectStore(store); }
function dbAdd(store, obj){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readwrite").add(obj);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = (e)=>reject(e);
  });
}
function dbPut(store, obj){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readwrite").put(obj);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = (e)=>reject(e);
  });
}
function dbGet(store, id){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readonly").get(id);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = (e)=>reject(e);
  });
}
function dbGetAll(store){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readonly").getAll();
    r.onsuccess = ()=>resolve(r.result || []);
    r.onerror = (e)=>reject(e);
  });
}
function dbDelete(store, id){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readwrite").delete(id);
    r.onsuccess = ()=>resolve();
    r.onerror = (e)=>reject(e);
  });
}
function dbClear(store){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readwrite").clear();
    r.onsuccess = ()=>resolve();
    r.onerror = (e)=>reject(e);
  });
}

/* =========================================================
   UTILIDADES
========================================================= */
function fmtMoney(n){
  const cfg = CONFIG || {moneda:"€"};
  const v = (Math.round((n||0)*100)/100).toFixed(2);
  return v + " " + (cfg.moneda || "€");
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-ES", {day:"2-digit", month:"short", year:"numeric"});
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function esc(s){
  if(s === undefined || s === null) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uidClass(){ return "id"+Math.random().toString(36).slice(2,9); }

function compressImage(file, maxWidth, quality){
  maxWidth = maxWidth || 1280; quality = quality || 0.72;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

   ESTADO GLOBAL
========================================================= */
let CONFIG = {key:"main", tarifaHora:25, moneda:"€"};
let CATALOGO = [];
let OBRAS = [];
let HORAS = [];
let MAT_OBRA = [];
let PLANOS = [];
let PINES = [];
let FOTOS = [];

let state = {
  view: "obras",       // obras | obra-detail | plano-detail | config
  obraId: null,
  tab: "resumen",       // resumen | horas | materiales | planos | presupuesto
  planoId: null,
  addPinMode: false,
  lightbox: null        // {pinId, index}
};

async function loadAll(){
  const cfg = await dbGet("config","main");
  if(cfg) CONFIG = cfg; else await dbPut("config", CONFIG);
  CATALOGO = await dbGetAll("materialesCatalogo");
  if(CATALOGO.length === 0){
    for(const m of SEED_CATALOGO){ await dbAdd("materialesCatalogo", m); }
    CATALOGO = await dbGetAll("materialesCatalogo");
  }
  OBRAS = await dbGetAll("obras");
  HORAS = await dbGetAll("horas");
  MAT_OBRA = await dbGetAll("materialesObra");
  PLANOS = await dbGetAll("planos");
  PINES = await dbGetAll("pines");
  FOTOS = await dbGetAll("fotos");
}

/* helpers de cálculo */
function horasDeObra(obraId){ return HORAS.filter(h=>h.obraId===obraId).sort((a,b)=> b.fecha.localeCompare(a.fecha)); }
function totalHoras(obraId){ return horasDeObra(obraId).reduce((s,h)=>s+Number(h.horas||0),0); }
function materialesDeObra(obraId){ return MAT_OBRA.filter(m=>m.obraId===obraId); }
function totalMateriales(obraId){ return materialesDeObra(obraId).reduce((s,m)=>s+ (Number(m.cantidad||0)*Number(m.precioUnitario||0)),0); }
function totalManoObra(obraId){ return totalHoras(obraId) * Number(CONFIG.tarifaHora||0); }
function totalPresupuesto(obraId){ return totalManoObra(obraId) + totalMateriales(obraId); }
function planosDeObra(obraId){ return PLANOS.filter(p=>p.obraId===obraId); }
function pinesDePlano(planoId){ return PINES.filter(p=>p.planoId===planoId); }
function fotosDePin(pinId){ return FOTOS.filter(f=>f.pinId===pinId); }

function badgeTipo(tipo){
  return tipo === "local" ? `<span class="badge badge-local"><span class="badge-dot"></span>Local comercial</span>`
                           : `<span class="badge badge-vivienda"><span class="badge-dot"></span>Vivienda</span>`;
}
function badgeEstado(estado){
  const map = {presupuestada:["Presupuestada","badge-presupuestada"], curso:["En curso","badge-curso"], terminada:["Terminada","badge-terminada"]};
  const [label, cls] = map[estado] || map.presupuestada;
  return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
}

function renderObraCard(o){
  const h = totalHoras(o.id);
  const total = totalPresupuesto(o.id);
  return `
    <div class="card" data-action="open-obra" data-id="${o.id}">
      <div class="card-row">
        <div>
          <p class="card-title">${esc(o.nombre)}</p>
          <p class="card-sub">${esc(o.cliente||"Sin cliente")}${o.direccion ? " · "+esc(o.direccion) : ""}</p>
        </div>
      </div>
      <div class="card-meta">${badgeTipo(o.tipo)}${badgeEstado(o.estado)}</div>
      <div class="stat-row">
        <div class="stat-pill"><b>${h.toFixed(1)}h</b><span>Horas</span></div>
        <div class="stat-pill"><b>${planosDeObra(o.id).length}</b><span>Planos</span></div>
        <div class="stat-pill"><b>${fmtMoney(total)}</b><span>Total</span></div>
      </div>
    </div>
  `;
}

  backdrop.className = "modal-backdrop" + (opts.center ? " center" : "");
  backdrop.id = "modal-backdrop";
  backdrop.innerHTML = `<div class="modal-sheet">${opts.center?"":'<div class="modal-handle"></div>'}${html}</div>`;
  backdrop.addEventListener("click", (e)=>{ if(e.target === backdrop) closeModal(); });
  document.body.appendChild(backdrop);
  modalOnClose = opts.onClose || null;
}
function closeModal(){
  const b = document.getElementById("modal-backdrop");
  if(b) b.remove();
  if(modalOnClose){ modalOnClose(); modalOnClose = null; }
}

function modalHeader(title){

  const data = {
    nombre,
    cliente: document.getElementById("f-cliente").value.trim(),

    tipo: document.getElementById("f-tipo").value,
    estado: document.getElementById("f-estado").value,

    notas: document.getElementById("f-notas").value.trim()
  };
  if(id){
    data.id = Number(id);
    data.createdAt = (OBRAS.find(o=>o.id===Number(id))||{}).createdAt || new Date().toISOString();
    await dbPut("obras", data);
  } else {

async function deleteObra(id){
  if(!confirm("¿Eliminar esta obra? Se borrarán también sus horas, materiales y planos.")) return;
  id = Number(id);
  for(const h of HORAS.filter(x=>x.obraId===id)) await dbDelete("horas", h.id);
  for(const m of MAT_OBRA.filter(x=>x.obraId===id)) await dbDelete("materialesObra", m.id);
  for(const p of PLANOS.filter(x=>x.obraId===id)){
    for(const pin of PINES.filter(x=>x.planoId===p.id)){
      for(const f of FOTOS.filter(x=>x.pinId===pin.id)) await dbDelete("fotos", f.id);
      await dbDelete("pines", pin.id);
    }
    await dbDelete("planos", p.id);
  }
  await dbDelete("obras", id);
  await loadAll();
  closeModal();
  state.view = "obras";
  render();
}

/* =========================================================
   EXPORT / IMPORT
========================================================= */
async function exportData(){
  const data = {};
  for(const s of STORES){ data[s] = await dbGetAll(s); }
  data.config = [CONFIG];
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "electrigest_backup_"+todayISO()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function importData(file){
  if(!confirm("Esto reemplazará todos los datos actuales por los del archivo. ¿Continuar?")) return;
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); } catch(e){ alert("Archivo no válido."); return; }
  for(const s of STORES){
    await dbClear(s);
    if(Array.isArray(data[s])){
      for(const item of data[s]){ await dbPut(s, item); }
    }
  }
  await loadAll();
  alert("Datos importados correctamente.");
  state.view = "obras";
  render();
}

/* =========================================================
   EVENTOS (delegación)
========================================================= */
document.addEventListener("click", async (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  const id = el.getAttribute("data-id");

  switch(action){
    case "go-obras": state.view="obras"; render(); break;
    case "go-config": state.view="config"; render(); break;
    case "close-modal": closeModal(); break;

    case "open-obra": state.obraId = Number(id); state.view="obra-detail"; state.tab="resumen"; render(); break;
    case "new-obra": openObraModal(null); break;
    case "edit-obra": openObraModal(OBRAS.find(o=>o.id===Number(id))); break;
    case "save-obra": saveObraFromModal(id); break;
    case "del-obra": deleteObra(id); break;

    case "set-tab": state.tab = el.getAttribute("data-tab"); renderObraDetail(); break;

    case "new-hora": openHoraModal(null); break;
    case "edit-hora": openHoraModal(HORAS.find(h=>h.id===Number(id))); break;
    case "save-hora": saveHoraFromModal(id); break;
    case "del-hora": deleteHora(id); break;

    case "new-material": openMaterialModal(null); break;
    case "edit-material": openMaterialModal(MAT_OBRA.find(m=>m.id===Number(id))); break;
    case "save-material": saveMaterialFromModal(id); break;
    case "del-material": deleteMaterial(id); break;

    case "new-plano": document.getElementById("plano-file-input").click(); break;
    case "open-plano": state.planoId = Number(id); state.view="plano-detail"; state.addPinMode=false; render(); break;
    case "del-plano": deletePlano(id); break;
    case "save-plano": savePlanoFromModal(); break;
    case "back-to-planos": state.view="obra-detail"; state.tab="planos"; render(); break;

    case "toggle-add-pin": state.addPinMode = !state.addPinMode; renderPlanoDetail(); break;
    case "open-pin": if(!state.addPinMode) openPinModal(id); break;
    case "save-pin-info": savePinInfo(id); break;
    case "del-pin": deletePin(id); break;
    case "add-photo-to-pin":
      window.__pinForPhoto = id;
      document.getElementById("pin-photo-input").click();
      break;

    case "pick-pin-cat": createPinWithCategoria(el.getAttribute("data-cat")); break;

    case "open-lightbox": openLightbox(el.getAttribute("data-pinid"), el.getAttribute("data-index")); break;
    case "close-lightbox": closeLightbox(); break;
    case "lightbox-prev": state.lightbox.index--; mountLightbox(); break;
    case "lightbox-next": state.lightbox.index++; mountLightbox(); break;
    case "save-photo-info": savePhotoInfo(id); break;
    case "del-photo": deletePhoto(id); break;

    case "new-catalogo": openCatalogoModal(null); break;
    case "edit-catalogo": openCatalogoModal(CATALOGO.find(c=>c.id===Number(id))); break;
    case "save-catalogo": saveCatalogoFromModal(id); break;
    case "del-catalogo": case "del-catalogo-item": deleteCatalogoItem(id); break;

    case "save-config": {
      CONFIG.tarifaHora = parseFloat(document.getElementById("cfg-tarifa").value)||0;
      CONFIG.moneda = document.getElementById("cfg-moneda").value;
      await dbPut("config", CONFIG);
      await loadAll();
      render();
      break;
    }
    case "export-data": exportData(); break;
    case "import-data": document.getElementById("import-file-input").click(); break;

    case "copiar-presupuesto": {
      const o = currentObra();
      const txt = `${o.nombre}\nCliente: ${o.cliente||"-"}\nHoras: ${totalHoras(o.id).toFixed(1)}h — Mano de obra: ${fmtMoney(totalManoObra(o.id))}\nMateriales: ${fmtMoney(totalMateriales(o.id))}\nTOTAL: ${fmtMoney(totalPresupuesto(o.id))}`;
      try{ await navigator.clipboard.writeText(txt); alert("Resumen copiado al portapapeles."); }
      catch(err){ alert(txt); }
      break;
    }
    case "imprimir-presupuesto": window.print(); break;
  }
});

document.addEventListener("change", async (e)=>{
  if(e.target.id === "plano-file-input" && e.target.files[0]){
    const compressed = await compressImage(e.target.files[0], 1600, 0.75);
    openPlanoNombreModal(compressed);
    e.target.value = "";
  }
  if(e.target.id === "pin-photo-input" && e.target.files[0]){
    await addPhotoToPin(window.__pinForPhoto, e.target.files[0]);
    e.target.value = "";
  }
  if(e.target.id === "import-file-input" && e.target.files[0]){
    await importData(e.target.files[0]);
    e.target.value = "";
  }
});

/* click en el plano para colocar un pin nuevo */
document.addEventListener("click", (e)=>{
  if(!state.addPinMode) return;
  const wrap = e.target.closest("#plano-canvas");
  if(!wrap) return;
  if(e.target.closest(".pin")) return;
  const img = document.getElementById("plano-img");
  const rect = img.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  if(x<0||x>100||y<0||y>100) return;
  openNuevoPinModal(Math.round(x*10)/10, Math.round(y*10)/10);
});

/* =========================================================
   INIT
========================================================= */
(async function init(){
  try{
    await openDB();
    await loadAll();
    render();
  }catch(err){
    document.getElementById("app").innerHTML = `<div style="padding:40px; text-align:center; font-family:sans-serif;">
      <h2>No se pudo abrir el almacenamiento local</h2>
      <p>Prueba a recargar la página. Si usas modo privado/incógnito, algunos navegadores bloquean el almacenamiento local.</p>
    </div>`;
    console.error(err);
  }
})();

})();
</script>
